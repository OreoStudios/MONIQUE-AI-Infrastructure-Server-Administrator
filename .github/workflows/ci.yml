name: MONIQUE validation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Backend unit tests
        run: mvn -B -f backend/pom.xml test
      - name: Python CLI and packaging tests
        run: |
          python3 -m unittest discover -s cli/tests -v
          python3 -m unittest discover -s scripts/tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: React TypeScript frontend build
        working-directory: frontend
        run: |
          npm install --no-audit --no-fund
          npm run build

  compose-smoke:
    runs-on: ubuntu-latest
    needs: tests
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Generate temporary test-only credentials
        run: |
          echo "MONIQUE_ADMIN_TOKEN=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "MONIQUE_ENCRYPTION_KEY_BASE64=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
          echo "POSTGRES_PASSWORD=$(openssl rand -hex 24)" >> "$GITHUB_ENV"
      - name: Build and launch the real Docker Compose stack
        run: docker compose up -d --build
      - name: Test secured API and frontend through Nginx
        timeout-minutes: 3
        run: |
          docker compose ps
          ok=0
          for i in $(seq 1 20); do
            if curl --connect-timeout 2 --max-time 5 -fsS \
                -H "Authorization: Bearer $MONIQUE_ADMIN_TOKEN" \
                http://127.0.0.1:8088/api/status -o /tmp/monique-status.json; then
              ok=1
              break
            fi
            sleep 2
          done
          test "$ok" = "1"
          python3 -c 'import json; data=json.load(open("/tmp/monique-status.json")); assert data["name"]=="MONIQUE" and not data["executionEnabled"]'
          curl --max-time 5 -fsS http://127.0.0.1:8088/ | grep -q 'MONIQUE'
          curl --max-time 5 -fsS -H "Authorization: Bearer $MONIQUE_ADMIN_TOKEN" \
              http://127.0.0.1:8088/api/pods -o /tmp/monique-pods.json
          python3 -c 'import json; assert json.load(open("/tmp/monique-pods.json"))==[]'
          unauthorized=$(curl --max-time 5 -s -o /dev/null -w "%{http_code}" \
              http://127.0.0.1:8088/api/pods)
          test "$unauthorized" != "200"

          # Regression: the previous release accidentally turned a blocked
          # chat POST into HTTP 401 and the React client logged the admin out.
          # Exercise the real browser cookie + CSRF flow, not just Bearer GETs.
          printf '{"token":"%s"}' "$MONIQUE_ADMIN_TOKEN" | \
              curl --max-time 8 -fsS -X POST \
                -H "Content-Type: application/json" \
                -c /tmp/monique-admin-cookies \
                --data-binary @- \
                http://127.0.0.1:8088/api/auth/login \
                -o /tmp/monique-admin-login.json
          csrf=$(python3 -c 'import json; print(json.load(open("/tmp/monique-admin-login.json"))["csrf"])')
          test -n "$csrf"
          # Request body intentionally has an invalid AI provider. If the
          # cookie/CSRF is accepted, MONIQUE's controller returns HTTP 400,
          # before any chargeable OpenAI/Anthropic provider call.
          chat_status=$(curl --max-time 8 -s -o /tmp/monique-chat-check.json -w "%{http_code}" \
              -X POST -b /tmp/monique-admin-cookies \
              -H "Content-Type: application/json" \
              -H "X-MONIQUE-CSRF: $csrf" \
              --data '{"message":"auth-smoke-test","provider":"UNKNOWN"}' \
              http://127.0.0.1:8088/api/ai/chat)
          test "$chat_status" = "400"
          # A missing CSRF must be 403, NOT 401. The real session must remain
          # active after a denied POST.
          blocked_status=$(curl --max-time 8 -s -o /dev/null -w "%{http_code}" \
              -X POST -b /tmp/monique-admin-cookies \
              -H "Content-Type: application/json" \
              --data '{"message":"auth-smoke-test","provider":"UNKNOWN"}' \
              http://127.0.0.1:8088/api/ai/chat)
          test "$blocked_status" = "403"
          curl --max-time 8 -fsS -b /tmp/monique-admin-cookies \
              http://127.0.0.1:8088/api/auth/session \
              -o /tmp/monique-admin-restored.json
          python3 -c 'import json; assert json.load(open("/tmp/monique-admin-restored.json"))["authenticated"]'
          # Sensitive credentials and CSRF values are intentionally not logged.
      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail=120
      - name: Clean up disposable CI environment
        if: always()
        run: docker compose down -v --remove-orphans
